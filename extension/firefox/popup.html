<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>PIA Core — Server Choice</title>
  <style>
    body { font-family: sans-serif; margin: 12px; min-width: 280px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #statusMessage { font-size: 12px; margin: 0 0 8px; min-height: 1.2em; }
    #serverList { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
    #serverList li { margin: 0; padding: 0; }
    #serverList button { display: flex; justify-content: space-between; width: 100%; margin: 2px 0; padding: 6px 8px; font-size: 12px; text-align: left; cursor: pointer; }
    #serverList button[aria-pressed="true"] { font-weight: bold; }
    #refreshButton { margin-top: 8px; font-size: 12px; }
    #credentialsHeading { font-size: 13px; margin: 0 0 6px; }
    #credentialsForm label { display: block; font-size: 12px; margin-top: 6px; }
    #credentialsForm input { display: block; width: 100%; box-sizing: border-box; margin-top: 2px; padding: 4px 6px; font-size: 12px; }
    #saveCredentialsButton { margin-top: 8px; font-size: 12px; }
    #credentialsStatusMessage { font-size: 12px; margin: 6px 0 10px; min-height: 1.2em; }
    .latency { margin-left: 8px; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>PIA Core — Server Choice</h1>
  <section aria-labelledby="credentialsHeading">
    <h2 id="credentialsHeading">PIA credentials</h2>
    <form id="credentialsForm">
      <label for="piaUsernameInput">Username</label>
      <input id="piaUsernameInput" type="text" autocomplete="username" />
      <label for="piaPasswordInput">Password</label>
      <input id="piaPasswordInput" type="password" autocomplete="current-password" />
      <button id="saveCredentialsButton" type="submit">Save credentials</button>
      <p id="credentialsStatusMessage" role="status"></p>
    </form>
  </section>
  <p id="statusMessage" role="status">Loading servers…</p>
  <ul id="serverList"></ul>
  <button id="refreshButton" type="button">Refresh list</button>
  <script src="popup.js"></script>
</body>
</html>
